<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartClip AI Register</title><link rel="stylesheet" href="/static/css.css"></head><body class="auth"><form id="regForm" class="authCard"><a class="brand" href="/">✦ SmartClip <b>AI</b></a><small>CREATE YOUR WORKSPACE</small><h1>Build your<br><span>video workflow.</span></h1><label>Username</label><input id="regUsername" class="input" minlength="2" required placeholder="Your name"><label>Email</label><input id="regEmail" class="input" type="email" required placeholder="you@example.com"><label>Password</label><input id="regPassword" class="input" type="password" minlength="6" required placeholder="Minimum 6 characters"><button class="primary">Create account <span>→</span></button><div id="regError" class="error"></div><p>Already registered? <a href="/login">Sign in</a></p></form><script>regForm.onsubmit=async e=>{e.preventDefault();regError.textContent='';let r=await fetch('/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({username:regUsername.value,email:regEmail.value,password:regPassword.value})});let d=await r.json();if(!r.ok){regError.textContent=d.detail||'Registration failed';return}location='/login'}</script></body></html>
