<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartClip AI Login</title><link rel="stylesheet" href="/static/css.css"></head><body class="auth"><form id="loginForm" class="authCard"><a class="brand" href="/">✦ SmartClip <b>AI</b></a><small>WELCOME BACK</small><h1>Sign in to your<br><span>video studio.</span></h1><label>Email</label><input id="loginEmail" class="input" type="email" required placeholder="you@example.com"><label>Password</label><input id="loginPassword" class="input" type="password" required placeholder="••••••••"><button class="primary">Sign in <span>→</span></button><div id="loginError" class="error"></div><p>New here? <a href="/register">Create an account</a></p></form><script>loginForm.onsubmit=async e=>{e.preventDefault();loginError.textContent='';let r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({email:loginEmail.value,password:loginPassword.value})});let d=await r.json();if(!r.ok){loginError.textContent=d.detail||'Login failed';return}location='/input'}</script></body></html>
